name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Estilo, análisis estático y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, fileinfo
          coverage: none

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo de código (Pint)
        run: vendor/bin/pint --test

      # Informativo hasta generar la línea base (ver README): muestra avisos sin bloquear.
      # Luego quitar continue-on-error para que un aviso nuevo haga fallar la CI.
      - name: Análisis estático (Larastan)
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Verifica que los estilos versionados en public/build compilen
      - name: Compilar assets
        run: npm run build

      - name: Pruebas
        run: php artisan test
